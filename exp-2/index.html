
<!DOCTYPE html>
<html>
<head>
    <title>Quiz App</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="quiz">
        <h1>🧠 Quiz App</h1>

        <p id="timer">Time: 30s</p>
        <h3 id="question"></h3>
        <div id="options"></div>

        <button onclick="restart()" id="restart" hidden>
            Restart Quiz
        </button>

        <h3 id="result"></h3>
    </div>

    <script src="script.js"></script>
</body>
</html>
